name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/mobile/**"
      - ".github/workflows/build-apk.yaml"

jobs:
  build:
    name: Build offline APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Initialize EAS project
        run: npx eas-cli@latest project:init --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: npx eas-cli@latest build:download --platform android --profile preview --latest --output dastyar-offline.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-offline-apk
          path: app/mobile/dastyar-offline.apk
          if-no-files-found: error
