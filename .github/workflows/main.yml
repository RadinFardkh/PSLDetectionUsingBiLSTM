name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/mobile/**'
      - 'app/.github/workflows/build-apk.yaml'

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Link Expo project
        run: npx eas-cli@latest init --non-interactive

      - name: Build signed APK with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        run: npx eas-cli@latest build:download --platform android --profile preview --latest --output dastyar-offline.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-offline-apk
          path: app/mobile/dastyar-offline.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        run: |
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK was built by EAS and uploaded as the dastyar-offline-apk artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Model is bundled locally; no inference server is used." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        run: npx eas-cli@latest build:list --platform android --limit 1
        continue-on-error: true
