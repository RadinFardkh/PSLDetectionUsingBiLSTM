name: Build Android APK

on:
  push:
    branches:
      - Android-app
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: app/psl_app/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('app/psl_app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: app/psl_app
          buildozer_version: stable
          buildozer_command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSL-Android-APK
          path: app/psl_app/bin/*.apk
          retention-days: 7
