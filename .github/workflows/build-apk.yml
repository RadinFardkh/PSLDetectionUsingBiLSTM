name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Android-app

permissions:
  contents: read

jobs:
  build:
    name: Build PSL AI APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            buildozer \
            "cython==0.29.34"

      - name: Show tool versions
        run: |
          python --version
          java -version
          buildozer --version
          rustc --version

      - name: Build APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
          P4A_BUILD_MINAPI: "24"
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psl-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
