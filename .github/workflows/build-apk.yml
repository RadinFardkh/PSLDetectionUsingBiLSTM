name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PSL AI APK
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5


      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ------------------------------------------------------------
      # Java 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # Linux dependencies
      # ------------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev


      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ------------------------------------------------------------
      # Install Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /dev/null || true

          echo
          echo "Installing required Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo
          echo "Installed Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo
          echo "Checking AIDL..."

          test -f "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo "AIDL found successfully."


      # ------------------------------------------------------------
      # Configure Buildozer SDK compatibility
      # ------------------------------------------------------------
      - name: Configure Buildozer Android SDK
        run: |
          set -e

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          echo "$BUILDOZER_SDK"

          echo
          echo "Runner Android SDK:"
          echo "$ANDROID_HOME"

          # Remove anything that may already exist.
          rm -rf "$BUILDOZER_SDK"

          # Make Buildozer use the GitHub runner's modern SDK.
          mkdir -p "$(dirname "$BUILDOZER_SDK")"

          ln -s "$ANDROID_HOME" "$BUILDOZER_SDK"

          echo
          echo "Buildozer SDK link:"
          ls -lah "$HOME/.buildozer/android/platform"


      # ------------------------------------------------------------
      # Create sdkmanager compatibility wrapper
      # ------------------------------------------------------------
      - name: Configure sdkmanager compatibility wrapper
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "Modern sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          # python-for-android expects the old path:
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Modern Android SDKs no longer contain this path.
          # Create a compatibility wrapper at the path p4a expects.

          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER" "\$@"
          EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

          echo
          echo "Compatibility sdkmanager:"
          ls -lh "$ANDROID_HOME/tools/bin/sdkmanager"

          echo
          echo "Testing compatibility sdkmanager:"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version


      # ------------------------------------------------------------
      # Verify Build Tools and AIDL
      # ------------------------------------------------------------
      - name: Verify Android SDK
        run: |
          set -e

          echo "========== Android SDK =========="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "SDK directory:"
          ls -lah "$ANDROID_HOME"

          echo
          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo
          echo "AIDL:"
          ls -lh "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo
          echo "Legacy sdkmanager compatibility path:"
          ls -lh "$ANDROID_HOME/tools/bin/sdkmanager"

          echo
          echo "sdkmanager version:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo
          echo "Android SDK verification passed."


      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Install Rust
        run: |
          set -e

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.6.0 \
            "cython==0.29.34"


      # ------------------------------------------------------------
      # Show versions
      # ------------------------------------------------------------
      - name: Show tool versions
        run: |
          set -e

          echo "========== Python =========="
          python --version

          echo
          echo "========== Java =========="
          java -version

          echo
          echo "========== Buildozer =========="
          buildozer --version

          echo
          echo "========== Cython =========="
          cython --version

          echo
          echo "========== Rust =========="
          rustc --version

          echo
          echo "========== Android SDK =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          sdkmanager --version

          echo
          echo "Build Tools:"
          ls "$ANDROID_HOME/build-tools"

          echo
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/37.0.0/aidl" --version || true


      # ------------------------------------------------------------
      # Verify project structure
      # ------------------------------------------------------------
      - name: Verify Android project
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Checking Android project..."

          test -f app/psl_app/buildozer.spec
          test -f app/psl_app/main.py
          test -f app/psl_app/engine.py
          test -f app/psl_app/app_config.py

          test -f app/psl_app/models/sign_model.tflite
          test -f app/psl_app/models/class_map.json
          test -f app/psl_app/models/palm_detection_full.tflite
          test -f app/psl_app/models/hand_landmark_full.tflite

          echo
          echo "Android project found successfully."

          echo
          echo "Buildozer spec:"
          ls -lh app/psl_app/buildozer.spec


      # ------------------------------------------------------------
      # Validate Python syntax
      # ------------------------------------------------------------
      - name: Validate Python syntax
        working-directory: app/psl_app
        run: |
          set -e

          python -m compileall -q .

          echo "Python syntax validation passed."


      # ------------------------------------------------------------
      # Final Buildozer SDK check
      # ------------------------------------------------------------
      - name: Verify Buildozer SDK
        run: |
          set -e

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          echo "$BUILDOZER_SDK"

          echo
          echo "SDK manager used by python-for-android:"

          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

          echo
          echo "Build Tools available:"

          "$BUILDOZER_SDK/tools/bin/sdkmanager" \
            --list \
            | grep "build-tools;37.0.0" \
            | head -n 5 || true

          echo
          echo "AIDL exists at:"

          test -f "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          echo "$BUILDOZER_SDK/build-tools/37.0.0/aidl"

          echo
          echo "Buildozer SDK verification passed."


      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build APK
        working-directory: app/psl_app
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"

          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          set -e

          echo "Build directory:"
          pwd

          echo
          echo "Buildozer spec:"
          ls -lh buildozer.spec

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "Buildozer SDK:"
          ls -lah "$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "Starting Buildozer..."

          buildozer android debug


      # ------------------------------------------------------------
      # Find generated APK
      # ------------------------------------------------------------
      - name: Find APK
        working-directory: app/psl_app
        run: |
          set -e

          echo "Generated APK files:"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"


      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psl-ai-debug-apk
          path: app/psl_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
