```yaml
# =============================================================================
# .github/workflows/build_apk.yml
#
# GitHub Actions workflow that builds the PSL AI Kivy app into an Android APK
# using Buildozer.
#
# PROJECT DIRECTORY:
#   app/psl_app/
#
# IMPORTANT:
#   The Buildozer project is located in app/psl_app, so Buildozer runs there.
#
# The application entry point is:
#   app/psl_app/main.py
#
# The Buildozer configuration is:
#   app/psl_app/buildozer.spec
# =============================================================================

name: Build Android APK

# -----------------------------------------------------------------------------
# Trigger conditions
# -----------------------------------------------------------------------------
#
# Automatically build when changes are pushed to the Android-app branch.
# You can also manually start the workflow from GitHub Actions.
#
on:
  push:
    branches:
      - Android-app
  workflow_dispatch:

jobs:

  build-android:
    name: Build APK (arm64-v8a)

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Step 1: Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Cache Buildozer global directory
      # -----------------------------------------------------------------------
      #
      # The cache contains downloaded Android SDK/NDK and other dependencies.
      # The cache is invalidated when buildozer.spec changes.
      #
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: app/psl_app/.buildozer-global
          key: buildozer-global-${{ hashFiles('app/psl_app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      # -----------------------------------------------------------------------
      # Step 3: Build the APK
      # -----------------------------------------------------------------------
      #
      # workdir is VERY IMPORTANT.
      #
      # Buildozer will run inside:
      #
      #   app/psl_app/
      #
      # Therefore it will automatically use:
      #
      #   app/psl_app/main.py
      #   app/psl_app/buildozer.spec
      #
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: app/psl_app
          buildozer_version: stable
          buildozer_command: android debug

      # -----------------------------------------------------------------------
      # Step 4: Upload the APK
      # -----------------------------------------------------------------------
      #
      # The APK generated by Buildozer is located in:
      #
      #   app/psl_app/bin/
      #
      # It will be uploaded as a GitHub Actions artifact.
      #
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSL-Android-APK
          path: app/psl_app/bin/*.apk
          retention-days: 7
```
