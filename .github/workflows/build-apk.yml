name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Verify Android configuration
        working-directory: app/psl_app
        run: |
          echo "=== buildozer.spec ==="
          grep -E "android.api|android.minapi|android.archs|requirements" buildozer.spec

      - name: Clean Buildozer environment
        working-directory: app/psl_app
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        working-directory: app/psl_app
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSL-Android-APK
          path: app/psl_app/bin/*.apk
          retention-days: 7
